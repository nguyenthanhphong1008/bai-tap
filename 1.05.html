<!DOCTYPE html>
<html>
<head>
    <title>Định dạng văn bản</title>
</head>
<body>
    <!-- Dòng đầu tiên: Tiêu đề canh giữa, cỡ chữ h2 -->
    <h2 align="center">Định dạng văn bản</h2>

    <!-- Hóa học -->
    <b>Hóa học: </b> 
    Nước: H<font color="#FF0000"><sub>2</sub></font>O ; 
    Axit Sunfuric: H<font color="#FF0000"><sub>2</sub></font>SO<font color="#FF0000"><sub>4</sub></font><br>

    <!-- Toán học -->
    <b>Toán học: </b> 
    Phương trình bậc 2: 
    <i>a</i>x<font color="#FF0000"><sup>2</sup></font> + <i>b</i>x + <i>c</i> = 0<br>

    <!-- Tin học -->
    <b>Tin học: </b> Vòng lặp For.<br>

    <!-- Đoạn code vòng lặp For với màu chữ, màu nền và canh lề -->
    <pre style="color: #0000CC; background-color: #CCCCCC;">
For i = 0 To 10
    Tong = Tong + i
Next
    </pre>
</body>
</html>
