<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Tiêu đề cửa sổ trang web -->
    <title>Sử dụng các tag cơ bản</title>
</head>
<body>

    <!-- Dòng 1: Tag <h1> và thuộc tính align để canh giữa -->
    <h1 align="center">Bài 01: Sử dụng các tag cơ bản</h1>

    <!-- Dòng 2: Tag <h2> và thuộc tính style(text-decoration) để gạch dưới -->
    <h2 style="text-decoration: underline;">Yêu cầu</h2>

    <!-- Dòng 3: Tag <p> và thuộc tính style(font-weight) để in đậm -->
    <p style="font-weight: bold;">Thiết kế trang web có nội dung như sau:</p>

    <!-- Đoạn văn bản: Tag <p> có thuộc tính align để canh giữa và tag <br> để xuống dòng -->
    <p align="center">
        Lập trình Web<br>
        Chào mừng các bạn đến với ngôn ngữ HTML
    </p>

</body>
</html>
